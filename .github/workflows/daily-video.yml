name: Daily tech briefing video

on:
  workflow_dispatch:
  schedule:
    # 12:20 UTC = 17:50 India Standard Time. GitHub schedules are best-effort.
    - cron: "20 12 * * *"

permissions:
  contents: read

concurrency:
  group: daily-tech-briefing
  cancel-in-progress: false

jobs:
  render:
    # Public repositories receive free standard GitHub-hosted runner usage.
    # The source code will be public; this project requires no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install free system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect news and render MP4
        run: python main.py

      - name: Upload video and source metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tech-briefing-video
          path: |
            output/tech_briefing.mp4
            output/script.txt
            output/sources.json
          retention-days: 7
          if-no-files-found: error
